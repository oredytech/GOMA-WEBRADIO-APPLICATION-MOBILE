name: Notify new articles

on:
  repository_dispatch:
    types: [article_published]
  workflow_dispatch:

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run notify:articles
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          APP_URL: ${{ secrets.APP_URL }}
          FIREBASE_DATABASE_URL: https://app-goma-webradio-default-rtdb.europe-west1.firebasedatabase.app
          ARTICLE_ID: ${{ github.event.client_payload.article_id }}
